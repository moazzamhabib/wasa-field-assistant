<!-- Native Username & Password Login Gate -->
    <div id="authGate" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-8 shadow-2xl border border-slate-100 space-y-6">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 bg-sky-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl shadow-lg shadow-sky-600/30">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="font-bold text-slate-900 text-xl">Secure Access</h2>
                <p class="text-xs text-slate-500">Please enter your credentials to access the Field Supervisor interface.</p>
            </div>

            <form onsubmit="handleAuthLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-regular fa-user"></i>
                        </span>
                        <input type="text" id="authUsername" required placeholder="Enter username"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" id="authPassword" required placeholder="Enter password"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition">
                    </div>
                </div>

                <div id="authError" class="hidden text-xs text-rose-600 text-center font-medium bg-rose-50 py-2 rounded-lg border border-rose-100">
                    Incorrect username or password.
                </div>

                <button type="submit" 
                    class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md shadow-sky-600/20 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    <span>Unlock Interface</span>
                </button>
            </form>
        </div>
    </div>
